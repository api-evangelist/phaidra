name: Phaidra
description: 'Phaidra builds AI agents for autonomous data center and industrial operations, using
  reinforcement learning to control cooling, power, and workloads in mission-critical facilities. Its
  products include Phaidra Prism, an LLM for data center operations that helps technicians identify,
  prioritize, and resolve infrastructure issues, and Phaidra Factory, self-learning AI agents that
  continuously monitor and optimize thermal reliability, energy efficiency, and IT capacity to maximize
  tokens per watt across AI factories. Phaidra is an enterprise vendor with no public API or developer
  program; this profile captures its public security, compliance, and web posture. Backed by Index
  Ventures.'
